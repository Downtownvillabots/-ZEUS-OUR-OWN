[build-system]
requires = [
    "setuptools>=75",
    "wheel>=0.45",
]
build-backend = "setuptools.build_meta"


[project]
name = "telegram-bot"
version = "1.0.0"
description = "Production Telegram bot application"
readme = "README.md"
requires-python = ">=3.12,<3.14"

authors = [
    { name = "Software Team" },
]

dependencies = [
    "python-telegram-bot>=22.0,<23.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "redis>=5.2,<6.0",
    "httpx>=0.28,<1.0",
    "aiohttp>=3.11,<4.0",
    "orjson>=3.10,<4.0",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=9.0,<10.0",
    "structlog>=25.0,<26.0",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "mypy>=1.14,<2.0",
    "ruff>=0.9,<1.0",
    "pre-commit>=4.0,<5.0",
]

test = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
]

[project.scripts]
telegram-bot = "bot.app.startup:run_application"
telegram-bot-health = "healthcheck:main"


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
where = [
    ".",
]

include = [
    "bot*",
]


# ============================================================================
# Ruff
# ============================================================================

[tool.ruff]
target-version = "py312"

line-length = 100

indent-width = 4

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "ASYNC",
    "S",
]

ignore = [
    "E501",
    "B008",
    "S101",
]

[tool.ruff.lint.per-file-ignores]

"tests/*" = [
    "S101",
]

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

line-ending = "lf"

skip-magic-trailing-comma = false


# ============================================================================
# MyPy
# ============================================================================

[tool.mypy]
python_version = "3.12"

strict = false

warn_return_any = true

warn_unused_configs = true

warn_redundant_casts = true

warn_unused_ignores = true

warn_unreachable = true

check_untyped_defs = true

disallow_untyped_defs = true

disallow_incomplete_defs = true

no_implicit_optional = true

ignore_missing_imports = true

show_error_codes = true

pretty = true

exclude = [
    "^tests/",
]


# ============================================================================
# Pytest
# ============================================================================

[tool.pytest.ini_options]

minversion = "8.0"

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
    "*_test.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--disable-warnings",
]

asyncio_mode = "auto"

markers = [
    "unit: isolated unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "slow: slow-running tests",
]


# ============================================================================
# Coverage
# ============================================================================

[tool.coverage.run]

branch = true

source = [
    "bot",
]

omit = [
    "tests/*",
    "*/__init__.py",
]


[tool.coverage.report]

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

show_missing = true

skip_covered = false

fail_under = 80


# ============================================================================
# Pre-commit
# ============================================================================

[tool.pre-commit]
# Documentation-only metadata section.
# Actual pre-commit configuration belongs in .pre-commit-config.yaml.