# ============================================================================
# Docker Compose
# ============================================================================
#
# Services:
#   bot        -> Telegram bot application
#   postgres   -> PostgreSQL database
#   redis      -> Redis cache / queue
#
# Start:
#   docker compose up -d --build
#
# Stop:
#   docker compose down
#
# Logs:
#   docker compose logs -f bot
#
# ============================================================================

name: telegram-bot

services:

  # ==========================================================================
  # Telegram Bot
  # ==========================================================================

  bot:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: telegram-bot

    restart: unless-stopped

    env_file:
      - .env

    environment:

      # ----------------------------------------------------------------------
      # Application
      # ----------------------------------------------------------------------

      ENVIRONMENT: ${ENVIRONMENT:-production}

      DEBUG: ${DEBUG:-false}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      BOT_MODE: ${BOT_MODE:-polling}

      # ----------------------------------------------------------------------
      # Telegram
      # ----------------------------------------------------------------------

      BOT_TOKEN: ${BOT_TOKEN}

      BOT_USERNAME: ${BOT_USERNAME:-}

      BOT_NAME: ${BOT_NAME:-}

      DROP_PENDING_UPDATES: ${DROP_PENDING_UPDATES:-true}

      # ----------------------------------------------------------------------
      # PostgreSQL
      # ----------------------------------------------------------------------

      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/telegram_bot}

      DATABASE_HOST: postgres

      DATABASE_PORT: 5432

      DATABASE_NAME: ${DATABASE_NAME:-telegram_bot}

      DATABASE_USER: ${DATABASE_USER:-postgres}

      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}

      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}

      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}

      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}

      DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE:-1800}

      DATABASE_ECHO: ${DATABASE_ECHO:-false}

      # ----------------------------------------------------------------------
      # Redis
      # ----------------------------------------------------------------------

      REDIS_ENABLED: ${REDIS_ENABLED:-true}

      REDIS_URL: redis://redis:6379/0

      REDIS_HOST: redis

      REDIS_PORT: 6379

      REDIS_DB: ${REDIS_DB:-0}

      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-20}

      # ----------------------------------------------------------------------
      # Storage
      # ----------------------------------------------------------------------

      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}

      STORAGE_PATH: /app/storage

      TEMP_PATH: /app/tmp

      UPLOAD_PATH: /app/storage/uploads

      DOWNLOAD_PATH: /app/storage/downloads

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:

      - bot_storage:/app/storage

      - bot_tmp:/app/tmp

      - bot_logs:/app/logs

    networks:

      - bot_network

    ports:

      - "${WEBHOOK_PORT:-8080}:8080"

    healthcheck:

      test:
        [
          "CMD",
          "python",
          "healthcheck.py",
          "--readiness",
          "--quiet"
        ]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 30s


  # ==========================================================================
  # PostgreSQL
  # ==========================================================================

  postgres:

    image: postgres:17-alpine

    container_name: telegram-bot-postgres

    restart: unless-stopped

    environment:

      POSTGRES_DB: ${DATABASE_NAME:-telegram_bot}

      POSTGRES_USER: ${DATABASE_USER:-postgres}

      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}

    volumes:

      - postgres_data:/var/lib/postgresql/data

    networks:

      - bot_network

    ports:

      - "${DATABASE_EXTERNAL_PORT:-5432}:5432"

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-telegram_bot}"
        ]

      interval: 10s

      timeout: 5s

      retries: 5

      start_period: 10s


  # ==========================================================================
  # Redis
  # ==========================================================================

  redis:

    image: redis:8-alpine

    container_name: telegram-bot-redis

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1000"
      ]

    volumes:

      - redis_data:/data

    networks:

      - bot_network

    ports:

      - "${REDIS_EXTERNAL_PORT:-6379}:6379"

    healthcheck:

      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s

      timeout: 5s

      retries: 5

      start_period: 5s


# ============================================================================
# Networks
# ============================================================================

networks:

  bot_network:

    name: telegram-bot-network

    driver: bridge


# ============================================================================
# Persistent volumes
# ============================================================================

volumes:

  postgres_data:

    name: telegram-bot-postgres-data

  redis_data:

    name: telegram-bot-redis-data

  bot_storage:

    name: telegram-bot-storage

  bot_tmp:

    name: telegram-bot-tmp

  bot_logs:

    name: telegram-bot-logs